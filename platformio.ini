; fuchsflasher – ATtiny85-Batch-Programmer auf ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB App-Partition statt 1,3 MB (OTA wird nicht benötigt)
board_build.partitions = huge_app.csv
build_flags = -Wall
lib_deps = bblanchon/ArduinoJson@^7.2.0
extra_scripts = pre:tools/hex2header.py
; HEX-Datei, die fest in den Programmer eingebettet wird
custom_target_hex = firmware/target.hex
